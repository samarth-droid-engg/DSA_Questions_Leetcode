<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DSA GitHub Pusher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text: #e6edf3;
      --muted: #8b949e;
      --danger: #f85149;
      --success: #3fb950;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      padding: 0;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      font-family: var(--mono);
    }

    /* Status bar */
    .status-bar {
      padding: 8px 20px;
      background: #0d1f0f;
      border-bottom: 1px solid #1a3a1d;
      font-family: var(--mono);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-bar.error { background: #1f0d0d; border-color: #3a1a1a; color: var(--danger); }
    .status-bar.error .status-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    /* Body */
    .body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 9px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: #484f58; }

    /* Token field with toggle */
    .token-wrap { position: relative; }
    .token-wrap input { padding-right: 40px; }
    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      padding: 2px;
    }
    .toggle-btn:hover { color: var(--text); }

    /* Platform toggles */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .platform-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      user-select: none;
    }

    .platform-toggle.active {
      background: #0d1f0f;
      border-color: var(--accent);
      color: var(--success);
    }

    .platform-toggle .icon { font-size: 18px; }

    /* Save button */
    .save-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      width: 100%;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.02em;
    }

    .save-btn:hover { background: var(--accent-hover); }
    .save-btn:active { transform: scale(0.98); }

    /* Help link */
    .help-link {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      text-align: center;
      display: block;
      font-family: var(--mono);
      transition: color 0.15s;
    }
    .help-link:hover { color: #58a6ff; }

    /* Toast inside popup */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: var(--mono);
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { border-left: 3px solid var(--success); color: var(--success); }
    .toast.err { border-left: 3px solid var(--danger); color: var(--danger); }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-num {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 -20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🚀</div>
    <div class="header-text">
      <h1>DSA GitHub Pusher</h1>
      <p>auto-commit your solved problems</p>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Ready — watching for accepted submissions</span>
  </div>

  <div class="body">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statToday">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statStreak">0</div>
        <div class="stat-label">Streak</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- GitHub Config -->
    <div class="field">
      <label>GitHub Username</label>
      <input type="text" id="username" placeholder="e.g. sam-dev" />
    </div>

    <div class="field">
      <label>Repository Name</label>
      <input type="text" id="repo" placeholder="e.g. DSA-Solutions" />
    </div>

    <div class="field">
      <label>Personal Access Token</label>
      <div class="token-wrap">
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
        <button class="toggle-btn" id="toggleToken" title="Show/hide token">👁</button>
      </div>
    </div>

    <!-- Platform toggles -->
    <div class="field">
      <label>Active Platforms</label>
      <div class="platform-grid">
        <div class="platform-toggle active" data-platform="leetcode">
          <span class="icon">🟨</span>LeetCode
        </div>
        <div class="platform-toggle active" data-platform="gfg">
          <span class="icon">🟩</span>GFG
        </div>
        <div class="platform-toggle active" data-platform="codeforces">
          <span class="icon">🟦</span>CF
        </div>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">Save Configuration</button>

    <a href="https://github.com/settings/tokens/new?scopes=repo&description=DSA-GitHub-Pusher"
       target="_blank" class="help-link">
      🔑 Generate GitHub token (repo scope needed)
    </a>

  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
